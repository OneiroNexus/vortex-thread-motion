name: Check preserved coordinate replay

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numeric dependency
        run: python -m pip install numpy==2.3.5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check recovered Inkline DOM contract
        run: node demos/inkline/verify.cjs
      - name: Check recovered Torus DOM contract
        run: node demos/torus/verify.cjs
      - name: Compare original decoder with native renderer math
        run: python legacy/recipe/verify_recipe.py --output results/ci-legacy-replay
      - name: Preserve explicit native and historical hash comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-replay-${{ matrix.os }}
          if-no-files-found: warn
          path: results/ci-legacy-replay/replay.json
